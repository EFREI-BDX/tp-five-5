services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: summarize_match
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d summarize_match"]
      interval: 5s
      timeout: 5s
      retries: 10

  summarize-match:
    build:
      context: ./summarize-match
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/summarize_match
      PORT: 3000
      RUST_LOG: summarize_match=info
      BASE_EVENT_SCHEMA_PATH: /schemas/BaseEvent.schema.json
    volumes:
      - ./tests/schemas:/schemas:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
