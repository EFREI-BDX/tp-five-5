<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>summarize-match live summary</title>
  <style>
    :root {
      --page: #f3f4f6;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --accent: #f03;
      --accent-dark: #c4002b;
      --blue: #0f5bd7;
      --green: #059669;
      --yellow: #facc15;
      --red: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      box-shadow: var(--shadow);
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
    }

    .crumbs span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-header {
      padding: 22px 18px 18px;
      border-bottom: 1px solid var(--line);
    }

    .date-line {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .team {
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 0;
    }

    .badge {
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #fff, #f8fafc);
      font-size: 22px;
      font-weight: 900;
      color: var(--blue);
    }

    .team.away .badge {
      color: var(--red);
    }

    .team-name {
      max-width: 100%;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .team-id {
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-block {
      min-width: 150px;
      text-align: center;
    }

    .score {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
    }

    .match-state {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .match-id {
      margin-top: 8px;
      color: var(--muted);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(260px, 2fr) auto;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .toolbar input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0 10px;
      outline: none;
    }

    .toolbar input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.12);
    }

    .btn {
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0 13px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      background: var(--surface);
    }

    .tab {
      position: relative;
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      padding: 13px 14px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .tab.active {
      color: var(--accent);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
    }

    .content {
      padding: 12px;
    }

    .headline-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .headline {
      display: grid;
      grid-template-columns: 84px 1fr;
      min-height: 72px;
      overflow: hidden;
      border-radius: 6px;
      background: #eef2f7;
    }

    .thumb {
      background:
        linear-gradient(135deg, rgba(15, 91, 215, 0.9), rgba(255, 0, 51, 0.85)),
        radial-gradient(circle at 30% 30%, #fff 0 7px, transparent 8px);
    }

    .headline-text {
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 8px 10px;
      min-width: 0;
    }

    .headline-text strong {
      font-size: 12px;
      line-height: 1.25;
    }

    .headline-text span {
      color: var(--muted);
      font-size: 11px;
    }

    .timeline {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .period-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      padding: 0 10px;
      background: #f0f1f3;
      color: #4b5563;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .event-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px minmax(0, 1fr);
      min-height: 48px;
      padding: 8px 8px;
      border-top: 1px solid #f1f3f5;
      align-items: start;
    }

    .event-row:first-child {
      border-top: 0;
    }

    .event-side {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .event-side.away {
      text-align: right;
      justify-items: end;
    }

    .event-center {
      display: grid;
      justify-items: center;
      gap: 4px;
      color: var(--muted);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 900;
    }

    .minute {
      color: var(--text);
    }

    .score-pill {
      min-width: 46px;
      padding: 3px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      text-align: center;
    }

    .event-main {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 12px;
      line-height: 1.35;
    }

    .event-side.away .event-main {
      flex-direction: row-reverse;
    }

    .event-icon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      min-width: 22px;
      height: 22px;
      border-radius: 6px;
      padding: 0 5px;
      background: #e5e7eb;
      color: #111827;
      font-size: 10px;
      font-weight: 900;
    }

    .event-icon.goal {
      background: #e0f2fe;
      color: #075985;
    }

    .event-icon.yellow {
      background: var(--yellow);
      color: #4a3500;
    }

    .event-icon.red {
      background: var(--red);
      color: #fff;
    }

    .event-icon.sub {
      background: #dcfce7;
      color: #047857;
    }

    .event-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 900;
    }

    .event-id-line {
      max-width: 100%;
      color: #9ca3af;
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 9px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .event-meta {
      max-width: 100%;
      color: var(--muted);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .stats-grid {
      display: grid;
      gap: 10px;
    }

    .stats-compare {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 90px minmax(120px, 1fr) 90px;
      align-items: center;
      min-height: 38px;
      padding: 0 10px;
      border-top: 1px solid #f1f3f5;
      gap: 10px;
    }

    .stats-row:first-child {
      border-top: 0;
      background: #f8fafc;
      font-weight: 900;
    }

    .stats-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
    }

    .stats-value {
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 0 4px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .section-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: none;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .award-card {
      display: grid;
      gap: 5px;
      min-height: 86px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: linear-gradient(180deg, #fff, #f8fafc);
    }

    .award-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .award-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .award-stat {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
    }

    .chart-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .goal-chart {
      width: 100%;
      height: 180px;
      overflow: visible;
    }

    .chart-axis {
      stroke: #d1d5db;
      stroke-width: 1;
    }

    .chart-grid {
      stroke: #eef2f7;
      stroke-width: 1;
    }

    .chart-home {
      fill: none;
      stroke: var(--blue);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-away {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-dot-home {
      fill: var(--blue);
    }

    .chart-dot-away {
      fill: var(--accent);
    }

    .chart-label {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 18px;
      height: 4px;
      border-radius: 999px;
      background: var(--blue);
    }

    .legend-swatch.away {
      background: var(--accent);
    }

    .bar-list {
      display: grid;
      gap: 10px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 64px minmax(120px, 1fr) 64px;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 900;
    }

    .bar-track {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      height: 14px;
      overflow: hidden;
      border-radius: 4px;
      background: #eef2f7;
    }

    .bar-half {
      position: relative;
      min-width: 0;
      background: #e5e7eb;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--w);
      background: var(--blue);
    }

    .bar-half.left .bar-fill {
      right: 0;
    }

    .bar-half.right .bar-fill {
      left: 0;
      background: var(--accent);
    }

    .compo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .team-sheet {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .team-sheet-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 900;
    }

    .court {
      display: grid;
      grid-template-rows: repeat(4, minmax(46px, auto));
      gap: 8px;
      margin: 0 10px;
      padding: 12px 8px;
      border: 1px solid #c7f0d8;
      border-radius: 6px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.22) 49%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0.22) 51%),
        linear-gradient(180deg, #dcfce7, #bbf7d0);
    }

    .court-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .player-chip {
      display: grid;
      gap: 3px;
      min-width: 0;
      max-width: 150px;
      padding: 7px 8px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      font-size: 11px;
      font-weight: 900;
      text-align: center;
    }

    .player-chip.keeper {
      border-color: rgba(15, 91, 215, 0.4);
      color: var(--blue);
    }

    .player-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .goal-badge {
      justify-self: center;
      min-width: 26px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }

    .bench {
      display: grid;
      gap: 6px;
      padding: 0 10px 10px;
    }

    .bench-title {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .bench-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .players-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
      font-size: 12px;
    }

    .players-table th,
    .players-table td {
      padding: 9px 8px;
      border-bottom: 1px solid #f1f3f5;
      text-align: center;
      white-space: nowrap;
    }

    .players-table th {
      background: #f8fafc;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .players-table td:first-child,
    .players-table th:first-child {
      text-align: left;
      white-space: normal;
    }

    .empty {
      padding: 32px 14px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      background: var(--surface-soft);
    }

    details {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    summary {
      cursor: pointer;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .json-tools {
      display: grid;
      gap: 8px;
      padding: 0 12px 12px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 10px;
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.4;
      outline: none;
    }

    .notice {
      display: none;
      margin: 0 12px 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #fff1f2;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .notice.visible {
      display: block;
    }

    @media (max-width: 700px) {
      .page {
        box-shadow: none;
      }

      .scoreboard {
        grid-template-columns: 1fr;
      }

      .score-block {
        order: -1;
      }

      .toolbar,
      .headline-strip {
        grid-template-columns: 1fr;
      }

      .award-grid,
      .compo-grid {
        grid-template-columns: 1fr;
      }

      .event-row {
        grid-template-columns: minmax(0, 1fr) 66px minmax(0, 1fr);
      }

      .score {
        font-size: 44px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="crumbs">
      <span>Football</span>
      <span>&gt;</span>
      <span>Europe</span>
      <span>&gt;</span>
      <span>summarize-match demo</span>
    </div>

    <section class="match-header">
      <div class="date-line" id="dateLine">Summary not loaded</div>
      <div class="scoreboard">
        <div class="team home">
          <div class="badge">H</div>
          <div class="team-name">Home</div>
          <div class="team-id" id="homeTeamId">-</div>
        </div>

        <div class="score-block">
          <div class="score" id="scoreLine">- - -</div>
          <div class="match-state" id="matchState">waiting</div>
          <div class="match-id" id="matchIdLine">-</div>
        </div>

        <div class="team away">
          <div class="badge">A</div>
          <div class="team-name">Away</div>
          <div class="team-id" id="awayTeamId">-</div>
        </div>
      </div>
    </section>

    <section class="toolbar" aria-label="Fetch controls">
      <input id="baseUrlInput" type="url" value="http://localhost:3000" aria-label="Base URL">
      <input id="matchIdInput" type="text" placeholder="match id" aria-label="Match ID">
      <button id="fetchButton" class="btn primary" type="button">Fetch</button>
    </section>

    <nav class="tabs" aria-label="Summary sections">
      <button class="tab active" type="button" data-tab="resume">Resume</button>
      <button class="tab" type="button" data-tab="stats">Stats</button>
      <button class="tab" type="button" data-tab="compos">Compos</button>
      <button class="tab" type="button" data-tab="players">Stats joueurs</button>
      <button class="tab" type="button" data-tab="comments">Commentaires</button>
    </nav>

    <section class="content">
      <div id="notice" class="notice"></div>
      <div id="mainPanel" class="timeline">
        <div class="empty">Fetch a match summary or paste JSON below.</div>
      </div>

      <details>
        <summary>JSON / fallback</summary>
        <div class="json-tools">
          <textarea id="jsonInput" spellcheck="false" placeholder="Paste the summary JSON here"></textarea>
          <button id="renderJsonButton" class="btn" type="button">Render pasted JSON</button>
          <button id="sampleButton" class="btn" type="button">Load example</button>
        </div>
      </details>
    </section>
  </main>

  <script>
    const teamNames = {
      "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee": "Arracheurs2Tana FC",
      "ffffffff-eeee-dddd-cccc-bbbbbbbbbbbb": "Mangeurs2Cavu FS"
    };

    const playerNames = {
      "00000000-0000-0000-0000-000000000001": "Gardien2Tana",
      "00000000-0000-0000-0000-000000000002": "Arracheur2Tana",
      "00000000-0000-0000-0000-000000000003": "Croqueur2Crampon",
      "00000000-0000-0000-0000-000000000004": "Frappeur2Beton",
      "00000000-0000-0000-0000-000000000005": "Glisseur2Surface",
      "00000000-0000-0000-0000-000000000006": "Gardien2Cavu",
      "00000000-0000-0000-0000-000000000007": "Mangeur2Cavu",
      "00000000-0000-0000-0000-000000000008": "Tacleur2Minuit",
      "00000000-0000-0000-0000-000000000009": "Voleur2Ballon",
      "00000000-0000-0000-0000-000000000010": "Passeur2Chaos",
      "00000000-0000-0000-0000-000000000011": "Finisseur2Tana",
      "00000000-0000-0000-0000-000000000012": "Sprinteur2Bitume",
      "00000000-0000-0000-0000-000000000013": "Buteur2Cavu",
      "00000000-0000-0000-0000-000000000014": "Dribbleur2Panik"
    };

    const teamRosters = {
      "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee": {

    async function fetchSummary() {
      const baseUrl = baseUrlInput.value.trim().replace(/\/$/, "");
      const matchId = matchIdInput.value.trim();

      if (!baseUrl || !matchId) {
        showNotice("Base URL and match ID are required.");
        return;
      }

      showNotice("");

      try {
        const response = await fetch(`${baseUrl}/matches/${encodeURIComponent(matchId)}/summary`);
        const text = await response.text();
        const body = text ? JSON.parse(text) : null;

        if (!response.ok) {
          throw new Error(body && body.message ? body.message : `HTTP ${response.status}`);
        }

        renderSummary(body);
      } catch (error) {
        showNotice(`${error.message}. If the browser blocks local API calls, paste the JSON in the fallback area.`);
      }
    }

      const events = buildTimelineEvents(summary);

        mainPanel.appendChild(element("div", "empty", "No visible event in this summary."));
        return;
      }

      const firstHalf = events.filter((event) => periodOf(event) === "FIRST_HALF");
      const secondHalf = events.filter((event) => periodOf(event) !== "FIRST_HALF");

      addPeriod("1. MI-TEMPS", firstHalf);
      addPeriod("2. MI-TEMPS", secondHalf);
    }

    function addPeriod(title, events) {
      const header = element("div", "period-header");
      header.appendChild(element("span", "", title));

      if (!events.length) {
        mainPanel.appendChild(element("div", "empty", "No event"));
        return;
      }

      events.forEach((event) => mainPanel.appendChild(renderEventRow(event)));
    }

    function buildTimelineEvents(summary) {
      let homeScore = 0;
      let awayScore = 0;
      const home = summary.homeTeamId;
      const away = summary.awayTeamId;
      const events = [];

      (summary.goals || []).forEach((goal) => {
        events.push({
          kind: "goal",
          side: sideFor(goal.scoringTeamId, home, away),
          matchTime: goal.matchTime,
          eventId: goal.eventId,
          title: goal.cancelled ? "Goal cancelled" : playerName(goal.scorerId),
          meta: goal.assistId ? `Assist ${playerName(goal.assistId)}` : "No assist",
          idMeta: [
            `scorer ${shortId(goal.scorerId)}`,
            goal.assistId ? `assist ${shortId(goal.assistId)}` : null,
            `team ${shortId(goal.scoringTeamId)}`
          ].filter(Boolean).join(" / "),
          scoringTeamId: goal.scoringTeamId,
          cancelled: Boolean(goal.cancelled)
        });
      });

      (summary.cards || []).forEach((card) => {
        const type = card.type || (card.card_number ? "YELLOW" : "CARD");
        events.push({
          kind: type === "RED" ? "red" : "yellow",
          side: sideFor(card.teamId, home, away),
          matchTime: card.matchTime,
          eventId: card.eventId,
          title: playerName(card.playerId),
          meta: `${type}${card.card_number ? ` ${card.card_number}` : ""}`,
          idMeta: `player ${shortId(card.playerId)} / team ${shortId(card.teamId)}`,
        });
      });

      (summary.substitutions || []).forEach((substitution) => {
        events.push({
          kind: "sub",
          side: sideFor(substitution.teamId, home, away),
          matchTime: substitution.matchTime,
          eventId: substitution.eventId,
          title: playerName(substitution.playerIn),
          meta: `Out ${playerName(substitution.playerOut)}`,
          idMeta: `in ${shortId(substitution.playerIn)} / out ${shortId(substitution.playerOut)} / team ${shortId(substitution.teamId)}`,
        });
      });

      events.sort(compareEvents);

      events.forEach((event) => {
        if (event.kind === "goal" && !event.cancelled) {
          if (event.side === "home") homeScore += 1;
          if (event.side === "away") awayScore += 1;
          event.score = `${homeScore} - ${awayScore}`;
        }
      });

      return events;
    }

    function renderEventRow(event) {
      const row = element("div", "event-row");
      const home = element("div", "event-side home");
      const center = element("div", "event-center");
      const away = element("div", "event-side away");

      center.appendChild(element("div", "minute", `${formatTime(event.matchTime)}'`));
      if (event.score) {
        center.appendChild(element("div", "score-pill", event.score));
      }

      const target = event.side === "away" ? away : home;
      target.appendChild(eventContent(event));

      row.appendChild(home);
      row.appendChild(center);
      row.appendChild(away);
      return row;
    }

    function eventContent(event) {
      const wrap = element("div", "");

      main.appendChild(element("span", `event-icon ${event.kind}`, iconText(event.kind)));

      wrap.appendChild(element("div", "event-id-line", event.idMeta || ""));
      wrap.appendChild(element("div", "event-id-line", `event ${shortId(event.eventId)}`));
      return wrap;
    }

        leftFill.style.setProperty("--w", `${Math.max(6, (left / max) * 100)}%`);
        rightFill.style.setProperty("--w", `${Math.max(6, (right / max) * 100)}%`);
        leftHalf.appendChild(leftFill);
        rightHalf.appendChild(rightFill);
        track.appendChild(leftHalf);
        track.appendChild(rightHalf);
        row.appendChild(track);
        row.appendChild(element("div", "", `${right} ${label}`));
        list.appendChild(row);

    function goalMomentumChart(summary) {
      const card = element("div", "chart-card");
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "goal-chart");
      svg.setAttribute("viewBox", "0 0 760 180");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Evolution cumulative du score");

      const goals = (summary.goals || [])
        .filter((goal) => !goal.cancelled)
        .slice()
        .sort(compareEvents);
      const finalHome = Number((summary.score || {}).home || 0);
      const finalAway = Number((summary.score || {}).away || 0);
      const maxScore = Math.max(finalHome, finalAway, 1);
      const x = (minute) => 42 + (Math.min(40, Math.max(0, minute)) / 40) * 680;
      const y = (score) => 145 - (score / maxScore) * 110;
      const homePoints = [[x(0), y(0)]];
      const awayPoints = [[x(0), y(0)]];
      let home = 0;
      let away = 0;

      goals.forEach((goal) => {
        const minute = Number((goal.matchTime || {}).minute || 0);
        if (goal.scoringTeamId === summary.homeTeamId) home += 1;
        if (goal.scoringTeamId === summary.awayTeamId) away += 1;
        homePoints.push([x(minute), y(home)]);
        awayPoints.push([x(minute), y(away)]);
      });
      homePoints.push([x(40), y(home)]);
      awayPoints.push([x(40), y(away)]);

      [0, 10, 20, 30, 40].forEach((minute) => {
        svg.appendChild(svgLine(x(minute), 28, x(minute), 150, "chart-grid"));
        svg.appendChild(svgText(x(minute), 168, `${minute}'`, "chart-label"));
      });
      svg.appendChild(svgLine(42, 150, 722, 150, "chart-axis"));
      svg.appendChild(svgLine(42, 28, 42, 150, "chart-axis"));
      svg.appendChild(svgPolyline(homePoints, "chart-home"));
      svg.appendChild(svgPolyline(awayPoints, "chart-away"));

      goals.forEach((goal) => {
        const minute = Number((goal.matchTime || {}).minute || 0);
        const scoreAtGoal = goals
          .filter((item) => Number((item.matchTime || {}).minute || 0) <= minute)
          .reduce((acc, item) => {
            if (item.scoringTeamId === summary.homeTeamId) acc.home += 1;
            if (item.scoringTeamId === summary.awayTeamId) acc.away += 1;
            return acc;
          }, { home: 0, away: 0 });
        const isHome = goal.scoringTeamId === summary.homeTeamId;
        svg.appendChild(svgCircle(x(minute), y(isHome ? scoreAtGoal.home : scoreAtGoal.away), isHome ? "chart-dot-home" : "chart-dot-away"));
      });

      const legend = element("div", "chart-legend");
      legend.appendChild(legendItem(teamName(summary.homeTeamId, "Home"), ""));
      legend.appendChild(legendItem(teamName(summary.awayTeamId, "Away"), "away"));
      card.appendChild(svg);
      card.appendChild(legend);
      return card;
    }

    function playerAwards(rows) {
      const grid = element("div", "award-grid");
      grid.appendChild(awardCard("Meilleur joueur", bestBy(rows, playerRating), (row) => `${playerRating(row).toFixed(1)} pts`));
      grid.appendChild(awardCard("Meilleur buteur", bestBy(rows, (row) => row.goals), (row) => `${row.goals || 0} buts`));
      grid.appendChild(awardCard("Meilleur gardien", bestBy(rows, (row) => row.saves), (row) => `${row.saves || 0} arrets`));
      grid.appendChild(awardCard("Meilleur passeur", bestBy(rows, (row) => (row.assists || 0) * 1000 + (row.passesSucceeded || 0)), (row) => `${row.assists || 0} assists / ${row.passesSucceeded || 0} passes`));
      return grid;
    }

    function awardCard(label, stats, detail) {
      const card = element("div", "award-card");
      card.appendChild(element("div", "award-label", label));
      card.appendChild(element("div", "award-name", stats ? playerName(stats.playerId) : "-"));
      card.appendChild(element("div", "award-stat", stats ? detail(stats) : "-"));
      if (stats) {
        card.appendChild(element("div", "event-id-line", teamName(stats.teamId, "-")));
      }
      return card;
    }

    function bestBy(rows, scoreFn) {
      return rows.reduce((best, row) => {
        if (!best) return row;
        return scoreFn(row) > scoreFn(best) ? row : best;
      }, null);
    }

    function playerRating(row) {
      return (
        (row.goals || 0) * 4 +
        (row.assists || 0) * 3 +
        (row.saves || 0) * 1.5 +
        (row.shotsOnTarget || 0) * 0.5 +
        (row.passesSucceeded || 0) * 0.08 -
        (row.foulsCommitted || 0) * 0.3 -
        (row.yellowCards || 0) * 0.7 -
        (row.redCards || 0) * 2
      );
    }

    function teamSheet(teamId, goalsByPlayer) {
      const roster = teamRosters[teamId] || { shape: [], bench: [], keeper: null };
      const sheet = element("div", "team-sheet");
      const title = element("div", "team-sheet-title");
      title.appendChild(element("span", "", teamName(teamId, "Equipe")));
      title.appendChild(element("span", "team-id", shortId(teamId)));
      sheet.appendChild(title);

      const court = element("div", "court");
      roster.shape.forEach((line) => {
        const courtLine = element("div", "court-line");
        line.forEach((playerId) => courtLine.appendChild(playerChip(playerId, goalsByPlayer, playerId === roster.keeper)));
        court.appendChild(courtLine);
      });
      sheet.appendChild(court);

      const bench = element("div", "bench");
      bench.appendChild(element("div", "bench-title", "Remplacants"));
      const benchList = element("div", "bench-list");
      roster.bench.forEach((playerId) => benchList.appendChild(playerChip(playerId, goalsByPlayer, false)));
      bench.appendChild(benchList);
      sheet.appendChild(bench);
      return sheet;
    }

    function playerChip(playerId, goalsByPlayer, isKeeper) {
      const chip = element("div", `player-chip${isKeeper ? " keeper" : ""}`);
      chip.title = playerId;
      chip.appendChild(element("span", "", playerName(playerId)));
      const goals = goalsByPlayer[playerId] || 0;
      if (goals > 0) {
        chip.appendChild(element("div", "goal-badge", `B x${goals}`));
      }
      return chip;
    }

    function countGoalsByPlayer(summary) {
      return (summary.goals || []).reduce((acc, goal) => {
        if (!goal.cancelled && goal.scorerId) {
          acc[goal.scorerId] = (acc[goal.scorerId] || 0) + 1;
        }
        return acc;
      }, {});
    }

    function svgLine(x1, y1, x2, y2, className) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("class", className);
      return line;
    }

    function svgText(x, y, text, className) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", "text");
      node.setAttribute("x", x);
      node.setAttribute("y", y);
      node.setAttribute("text-anchor", "middle");
      node.setAttribute("class", className);
      node.textContent = text;
      return node;
    }

    function svgPolyline(points, className) {
      const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      polyline.setAttribute("points", points.map(([x, y]) => `${x},${y}`).join(" "));
      polyline.setAttribute("class", className);
      return polyline;
    }

    function svgCircle(x, y, className) {
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", x);
      circle.setAttribute("cy", y);
      circle.setAttribute("r", "4");
      circle.setAttribute("class", className);
      return circle;
    }

    function legendItem(label, extraClass) {
      const item = element("span", "legend-item");

    function statsRow(left, label, right) {

    function playerStatsTable(rows) {
      const table = element("table", "players-table");
      const thead = document.createElement("thead");
      const header = document.createElement("tr");
      ["Joueur", "Equipe", "B", "A", "Tirs", "TC", "Passes", "OK", "Arr", "F", "J", "R", "In", "Out"].forEach((label) => {

      const tbody = document.createElement("tbody");
      rows
        .sort((left, right) => playerName(left.playerId).localeCompare(playerName(right.playerId)))
        .forEach((stats) => {
          const tr = document.createElement("tr");
          [
            playerName(stats.playerId),
            teamName(stats.teamId, "-"),
            stats.goals,
            stats.assists,
            stats.shots,
            stats.shotsOnTarget,
            stats.passesAttempted,
            stats.passesSucceeded,
            stats.saves,
            stats.foulsCommitted,
            stats.yellowCards,
            stats.redCards,
            stats.substitutionsIn,
            stats.substitutionsOut
          ].forEach((value) => tr.appendChild(element("td", "", String(value ?? 0))));
          tbody.appendChild(tr);
        });
      table.appendChild(tbody);
      return table;
    }

    async function fetchJson(path) {
      const baseUrl = baseUrlInput.value.trim().replace(/\/$/, "");
      const response = await fetch(`${baseUrl}${path}`);
      const text = await response.text();
      const body = text ? JSON.parse(text) : null;
      if (!response.ok) {
        throw new Error(body && body.message ? body.message : `HTTP ${response.status}`);
      }
      return body;
    }

    function iconText(kind) {
      if (kind === "goal") return "GOAL";
      if (kind === "yellow") return "YC";
      if (kind === "red") return "RC";
      if (kind === "sub") return "SUB";
      return "EV";
    }

    function periodScore(events) {
      let home = 0;
      let away = 0;
      events.forEach((event) => {
        if (event.kind !== "goal" || event.cancelled) return;
        if (event.side === "home") home += 1;
        if (event.side === "away") away += 1;
      });
      return `${home} : ${away}`;
    }

    function sideFor(teamId, homeTeamId, awayTeamId) {
      if (teamId === awayTeamId) return "away";
      if (teamId === homeTeamId) return "home";
      return "home";
    }

    function periodOf(event) {
      return event.matchTime && event.matchTime.period ? event.matchTime.period : "FIRST_HALF";
    }

    function compareEvents(left, right) {
      const leftTime = left.matchTime || {};
      const rightTime = right.matchTime || {};
      const leftMinute = Number(leftTime.minute || 0);
      const rightMinute = Number(rightTime.minute || 0);
      const leftSecond = Number(leftTime.second || 0);
      const rightSecond = Number(rightTime.second || 0);

      if (leftMinute !== rightMinute) return leftMinute - rightMinute;
      if (leftSecond !== rightSecond) return leftSecond - rightSecond;
      return orderOf(left.kind) - orderOf(right.kind);
    }

    function orderOf(kind) {
      return { goal: 1, yellow: 2, red: 2, sub: 3 }[kind] || 9;
    }

    function formatTime(matchTime) {
      if (!matchTime) return "--";
      const minute = String(matchTime.minute ?? 0).padStart(2, "0");
      return `${minute}`;
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.toggle("visible", Boolean(message));
    }

    function teamName(teamId, fallback) {
      return teamNames[teamId] || fallback || teamId || "-";
    }

    function teamLabel(teamId) {
      if (!teamId) return "-";
      const name = teamNames[teamId];
      return name ? `${name} (${shortId(teamId)})` : teamId;
    }

    function playerName(playerId) {
      return playerNames[playerId] || playerId || "-";
    }

    function shortId(value) {
      if (!value) return "-";
      const parts = String(value).split("-");
      return parts.length === 5 ? `#${parts[4].slice(-4)}` : String(value).slice(0, 8);
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
  </script>
</body>
</html>
