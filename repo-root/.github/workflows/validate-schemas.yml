name: Validate JSON fixtures

on:
  push:
    branches: [ master, 'group-04-summarize-match/develop' ]
  pull_request:
    branches: [ master ]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r groups/group-04-summarize-match/requirements-dev.txt
      - name: Run schema validation
        run: |
          python groups/group-04-summarize-match/scripts/validate_schemas.py
